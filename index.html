<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Protein Calendar</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#667eea,#764ba2);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
}

.card{
    background:white;
    border-radius:24px;
    padding:28px;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
}

.logo{
    text-align:center;
    font-size:60px;
    margin-bottom:10px;
}
    .company-name{
    text-align:center;
    font-size:30px;
    font-weight:700;
    color:#333;
}

.title{
    text-align:center;
    font-size:28px;
    font-weight:700;
    color:#333;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-top:6px;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#444;
}

input[type="date"]{
    width:100%;
    padding:14px;
    border:2px solid #ddd;
    border-radius:12px;
    font-size:16px;
}

.result{
    margin-top:25px;
    background:#f8f9ff;
    border-radius:18px;
    padding:20px;
    display:none;
}

.result-header{
    font-size:14px;
    color:#666;
    margin-bottom:12px;
}

.info-row{
    font-size:16px;
    color:#444;
    margin-bottom:10px;
}

.protein{
    font-size:16px;
    color:#444;
    margin-bottom:10px;
}

.loading{
    text-align:center;
    margin-top:15px;
    color:#666;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#999;
    font-size:12px;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<div class="logo"></div>
    <div class="company-name">
Vantage Fishmeal
</div>

<div class="title">
Protein Calendar
</div>

<div class="subtitle">
Lab Analysis Reoort
</div>

<label>Select Date</label>

<input
type="date"
id="datePicker"
/>

<div id="loading" class="loading"></div>

<div id="result" class="result">

<div class="result-header">
Lab Analysis Result
</div>

<div id="selectedDate" class="info-row"></div>
    <div id="lotNo" class="info-row"></div>
    <div id="boatName" class="info-row"></div>
    <div id="tvbn" class="info-row"></div>

<div id="proteinText" class="protein"></div>

</div>

<div class="footer">
Powered by LINE LIFF + n8n
</div>

</div>

</div>

<script>

const LIFF_ID = "2010771379-0v8talZ9";

/* YOUR N8N WEBHOOK URL */
const WEBHOOK_URL =
"https://sage-loon.pikapod.net/webhook-test/protein";

async function initLiff(){

    try{

        await liff.init({
            liffId: LIFF_ID
        });

        console.log("LIFF Ready");

    }catch(err){

        console.error(err);

    }

}

document
.getElementById("datePicker")
.addEventListener("change", async function(){

    const selectedDate = this.value;

    console.log("Sending date:",selectedDate);

    document.getElementById("loading")
    .innerText = "Loading...";

    document.getElementById("result")
    .style.display = "none";

    try{

        const response = await fetch(
            WEBHOOK_URL,
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    date:selectedDate
                })
            }
        );

        const data = await response.json();
        console.log(data);
       

        document.getElementById("selectedDate").innerText =
"Date : " + data.Date;

document.getElementById("lotNo").innerText =
"Lot No : " + data["Lot No"];

document.getElementById("boatName").innerText =
"Boat Name : " + data["Boat Name"];

document.getElementById("tvbn").innerText =
"TvBN : " + data.TvBN;

document.getElementById("proteinText").innerText =
"Protein : " + data.Protein;
        document.getElementById("result")
        .style.display = "block";

    }catch(error){

        console.error(error);

        document.getElementById("selectedDate")
        .innerText = "";

        document.getElementById("proteinText")
        .innerText =
        "❌ Unable to load protein data";

        document.getElementById("result")
        .style.display = "block";
    }

    document.getElementById("loading")
    .innerText = "";

});

initLiff();

</script>

</body>
</html>
